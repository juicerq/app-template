directories:
  output: dist
  buildResources: build

# better-sqlite3 12.x is NAPI; the prebuilt downloaded by `bun install`
# works in both Node (vitest) and Electron. Forcing a rebuild here pins
# the .node binary to Electron's Node ABI and breaks the test runner.
npmRebuild: false

files:
  - out/**/*
  - package.json

asarUnpack:
  - "**/*.{node,dll}"

linux:
  target:
    - target: AppImage
      arch: x64
  category: Utility

win:
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: juicerq
  repo: app-template
